# Dependabot configuration
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Bun is supported under the "npm" ecosystem — Dependabot reads bun.lock.
version: 2
updates:
  # App dependencies (package.json + bun.lock)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    ignore:
      # TS majors are breaking; take them as a deliberate migration, not a bump.
      # Patch/minor (5.x) still flow through.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    # Group low-risk updates into a single PR to cut noise; keep majors
    # separate so breaking changes get reviewed one at a time.
    groups:
      production-minor-patch:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      dev-minor-patch:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions used in .github/workflows (checkout, setup-bun, ...)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions:
        patterns:
          - "*"
