name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Required by the `main` ruleset, under this name. Runs the same checks, in the
  # same order, as github-agents' implement (see .github/agents.yml).
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      # Strict install: fails loudly if package.json and bun.lock have drifted.
      # Dependabot's "bun" ecosystem regenerates bun.lock itself, so its PRs pass too.
      - name: Install dependencies (frozen)
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      # The smoke suite serves the dist/ built above (playwright.config.ts skips the build under CI).
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Smoke test (Playwright)
        run: bun run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # Auto-merge low-risk Dependabot PRs (patch + minor), only after `checks`
  # passes. The ruleset requires `checks` too. Major bumps wait for manual review.
  dependabot-auto-merge:
    needs: checks
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3

      - name: Merge patch & minor updates
        if: >-
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --squash --delete-branch "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
